<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE COUGAR ROARINATOR!!</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#002E5D repeating-linear-gradient(45deg,#002E5D 0 22px,#0a3a70 22px 44px);color:#fff;font-family:'Bangers',cursive;text-align:center;overflow-x:hidden}
h1{font-size:clamp(2.2rem,9vw,4.5rem);margin:.4em .2em 0;letter-spacing:2px;color:#fff;-webkit-text-stroke:3px #000;text-shadow:5px 5px 0 #000;transform:rotate(-3deg)}
.sub{font-family:'Press Start 2P',monospace;font-size:.7rem;color:#ffe14d;text-shadow:2px 2px 0 #000;margin:.6em}
#btn{margin:1.2em auto;width:min(78vw,320px);aspect-ratio:1;border:7px solid #000;border-radius:50%;background:#fff;box-shadow:10px 10px 0 #000;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:transform .08s}
#btn:active{transform:translate(5px,5px);box-shadow:5px 5px 0 #000}
#btn.playing{animation:pulse .35s infinite alternate}
@keyframes pulse{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.1) rotate(4deg)}}
svg{width:100%;height:100%}
.bubble{display:inline-block;background:#fff;color:#000;border:4px solid #000;border-radius:18px;padding:.4em .8em;font-size:1.6rem;box-shadow:5px 5px 0 #000;transform:rotate(2deg);min-height:1.2em}
footer{font-family:'Press Start 2P',monospace;font-size:.55rem;margin:2em 1em;opacity:.8;line-height:1.8}
</style></head><body>
<h1>THE COUGAR<br>ROARINATOR!!</h1>
<div class="sub">PUSH THE KITTY. FEAR THE KITTY.</div>
<button id="btn" aria-label="Press to roar">
<svg viewBox="0 0 200 200"><g stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
<path d="M45 70 L35 25 L80 50 Z" fill="#c98a3d"/><path d="M155 70 L165 25 L120 50 Z" fill="#c98a3d"/>
<path d="M50 60 Q100 30 150 60 Q180 110 150 155 Q100 190 50 155 Q20 110 50 60Z" fill="#d99a4e"/>
<ellipse cx="75" cy="90" rx="14" ry="17" fill="#fff"/><ellipse cx="128" cy="86" rx="11" ry="20" fill="#fff"/>
<circle cx="78" cy="94" r="5" fill="#000"/><circle cx="124" cy="90" r="6" fill="#000"/>
<path d="M60 70 L90 80" /><path d="M140 66 L115 76"/>
<path d="M92 112 L108 112 L100 122 Z" fill="#000"/>
<path d="M68 132 Q100 175 134 132 Z" fill="#7a1010"/>
<path d="M78 134 L84 146 L90 135 M110 135 L116 146 L122 134" fill="#fff"/>
<path d="M60 118 L25 110 M60 125 L28 130 M142 118 L177 110 M142 125 L174 130" stroke-width="4"/>
<text x="100" y="196" font-family="Bangers" font-size="22" fill="#002E5D" stroke="none" text-anchor="middle">Y</text>
</g></svg></button><br>
<div class="bubble" id="say">TAP IT. I DARE YA.</div>
<audio id="roar" src="full_roar.mp3" preload="auto" playsinline></audio>
<footer>THIS WEBSITE IS 100% SCIENTIFICALLY LOUD.<br>NOT AFFILIATED WITH BYU. OR WITH ANYONE. EVER.</footer>
<script>
const a=document.getElementById('roar'),b=document.getElementById('btn'),s=document.getElementById('say');
const lines=["CONSIDER YOURSELF ROARED AT!","THAT'S A LOT OF ROAR FOR ONE CAR!","THE COUGAR REMAINS UNIMPRESSED.","TROPHY FOR LOUDEST GUY: AWARDED.","YOUR EARDRUMS SAY 'HOLY COW.'","GO COUGS! ...AND ALSO GO AWAY."];
b.addEventListener('click',()=>{a.pause();a.currentTime=0;const p=a.play();if(p)p.catch(()=>{});b.classList.add('playing');s.textContent=lines[Math.floor(Math.random()*lines.length)];});
a.addEventListener('ended',()=>b.classList.remove('playing'));a.addEventListener('pause',()=>{if(a.ended||a.currentTime===0)b.classList.remove('playing')});
</script></body></html>
